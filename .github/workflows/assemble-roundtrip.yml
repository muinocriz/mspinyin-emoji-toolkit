name: Assemble roundtrip CSV

on:
  push:
    branches: [master]
    paths:
      - 'data/roundtrip_b64_parts/trigger.txt'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify exact CSV
        shell: bash
        run: |
          cat \
            data/roundtrip_b64_parts/chunk_000.b64 \
            data/roundtrip_b64_parts/chunk_001.b64 \
            data/roundtrip_b64_parts/chunk_002.b64 \
            data/roundtrip_b64_parts/chunk_003.b64 \
            data/roundtrip_b64_parts/chunk_004.b64 \
            data/roundtrip_b64_parts/chunk_005.b64 \
            | base64 -d | gzip -d > data/ChsPinyinUDP_full_roundtrip.csv
          test "$(wc -l < data/ChsPinyinUDP_full_roundtrip.csv)" -eq 3100
          echo "42d351f345ddea6f9b1423bbb4dfdce7756420e09cdec0ee86318891bc98d5d2  data/ChsPinyinUDP_full_roundtrip.csv" | sha256sum -c -
      - name: Commit final data and clean temporary assembly files
        shell: bash
        run: |
          rm -rf data/full_roundtrip_parts data/roundtrip_b64_parts
          git rm .github/workflows/assemble-roundtrip.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add full roundtrip CSV"
          git push
