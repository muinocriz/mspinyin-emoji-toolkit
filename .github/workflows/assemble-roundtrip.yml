name: Assemble roundtrip CSV

on:
  push:
    branches: [master]
    paths:
      - 'data/roundtrip_b64_parts/chunk_005b.b64'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and verify exact CSV
        shell: bash
        run: |
          cat data/roundtrip_b64_parts/chunk_*.b64 | base64 -d | gzip -d > data/ChsPinyinUDP_full_roundtrip.csv
          test "$(wc -l < data/ChsPinyinUDP_full_roundtrip.csv)" -eq 3100
          echo "ef0bfb8affa8bcc975f7d9abd36d64e85c558691c9ba9df59f36afeddab79622  data/ChsPinyinUDP_full_roundtrip.csv" | sha256sum -c -
      - name: Commit final data and remove temporary assembly files
        shell: bash
        run: |
          rm -rf data/full_roundtrip_parts data/roundtrip_b64_parts
          git rm .github/workflows/assemble-roundtrip.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add full roundtrip CSV"
          git push
